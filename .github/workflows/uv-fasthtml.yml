name: uv-fasthtml

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: uv-fasthtml
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: "Install dependencies"
        run: just restore

      - name: "Run linter"
        run: just lint

      - name: "Run unit tests"
        run: just unit

      - name: "Run integration tests"
        run: just integration

      - name: "Install Playwright browsers"
        run: uv run playwright install

      - name: "Run server"
        run: TESTING=true just serve

      - name: "Run e2e tests"
        run: just e2e

      - name: "Kill server"
        run: just stop
